<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
<body>
  {%- assign nav = page.nav | default: 'blog' -%}
  <div class="top">
    <a class="brand" href="{{ '/' | relative_url }}">bshyuunn</a>
    <nav aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/blog/' | relative_url }}"{% if nav == 'blog' %} aria-current="page"{% endif %}>Blog</a>
    </nav>
  </div>
  <div class="crop" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="wrap{% if page.layout == 'post' %} wide{% endif %}">
    {{ content }}
  </main>
</body>
</html>
