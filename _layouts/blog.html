---
layout: base
---
<div class="stack blog">

<header class="page-head">
  <h1>Blog</h1>
  <div class="hatch" aria-hidden="true"></div>
</header>

<div class="post-list">
  {%- for post in site.posts %}
  <a class="post-row" href="{{ post.url | relative_url }}">
    <time class="pr-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
    <span class="pr-main">
      <span class="t">{{ post.title | escape }}</span>
      {%- if post.tags.size > 0 %}
      <span class="tags">{% for tag in post.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}</span>
      {%- endif %}
    </span>
  </a>
  {%- endfor %}
</div>

<footer class="foot split">
  <span>© {{ site.time | date: "%Y" }} Songhyun Bae</span>
  <span class="foot-links"><a href="https://github.com/bshyuunn">github</a><a href="https://x.com/bshyuunn">x</a><a href="{{ '/feed.xml' | relative_url }}">rss</a></span>
</footer>

</div>
